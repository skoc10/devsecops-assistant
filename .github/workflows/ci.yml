name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Aynı PR'a gelen yeni commit eskisinin koşusunu iptal eder; varsayılan dal geçmişi eksiksiz kalır.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (node ${{ matrix.node }})
    # Etiket sabit: `ubuntu-latest` Ubuntu 26'ya taşınıyor (AppArmor/bubblewrap/PostgreSQL sürümleri değişir).
    # Geçiş bilinçli yapılmalı; aşağıdaki "atlanan test yok" adımı sessiz kapsam kaybını yakalar.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # package.json `engines`: ^22.18.0 || >=24 → iki ana sürüm de koşar (22 = .nvmrc). Biri düşerse diğeri iptal edilmez.
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      # Eylemler tam commit SHA'sıyla sabitlendi (etiket taşınabilir); güncellemeleri Dependabot önerir.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: node --version
      # Bağımlılık yaşam-döngüsü scriptleri kapalı (pnpm-workspace.yaml: onlyBuiltDependencies: [], strictDepBuilds)
      - run: pnpm install --frozen-lockfile
      # Gerçek OS sandbox testleri (S-15) için bubblewrap. Ubuntu 24.04 runner'larında AppArmor
      # kullanıcı ad alanlarını kısıtlar; kısıt aşağıda kaldırılır ve bwrap'in çalıştığı ayrıca doğrulanır.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Gerçek PostgreSQL testleri (S-02/S-03/S-14 DB ayağı, I-02): testkit geçici bir küme başlatır
      # (TLS + scram; ayrı süreç, yalnız loopback).
      - run: sudo apt-get install -y postgresql postgresql-client
      # IaC testleri (S-17..S-19, Faz 1b): OpenTofu ve Terraform (sürüm + sha256 PİNLİ), ansible-core + ansible-lint (pip, sürüm
      # pinli, ayrı venv). sha256 değerleri yayıncıların SHA256SUMS dosyalarıyla (aynı kaynaktan) eşleştirildi;
      # SHA256SUMS imza doğrulaması (GPG/cosign) yapılmadı → "doğrulanacak".
      - name: IaC araçları (OpenTofu, Terraform, ansible-core, ansible-lint)
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/ops-tools"; mkdir -p "$T/bin" "$T/dl"
          curl -fsSL -o "$T/dl/tofu.zip" "https://github.com/opentofu/opentofu/releases/download/v1.8.5/tofu_1.8.5_linux_amd64.zip"
          echo "e2951ba6be8ae9427aabbd5c6f243855e8b526cb2ae6bc33a05dae22d7e82632  $T/dl/tofu.zip" | sha256sum -c -
          curl -fsSL -o "$T/dl/tf.zip" "https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip"
          echo "186e0145f5e5f2eb97cbd785bc78f21bae4ef15119349f6ad4fa535b83b10df8  $T/dl/tf.zip" | sha256sum -c -
          unzip -q -o "$T/dl/tofu.zip" tofu -d "$T/bin"; unzip -q -o "$T/dl/tf.zip" terraform -d "$T/bin"
          python3 -m venv "$T/venv"
          "$T/venv/bin/pip" install --quiet "ansible-core==2.21.5" "ansible-lint==26.10.1"
          echo "OPS_TOOL_DIRS=$T/bin:$T/venv/bin" >> "$GITHUB_ENV"
      # Kısıt kaldırılamazsa iş burada düşer: sandbox testleri sessizce atlanmaz.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: OS sandbox kullanılabilir (ürünün kendi yoklamasıyla)
        run: |
          node --input-type=module -e '
            const { detectSandbox } = await import("./packages/sandbox/src/index.ts");
            const sb = await detectSandbox();
            if (!sb) { console.error("::error::OS sandbox (bubblewrap) çalışmıyor"); process.exit(1); }
            console.log(`sandbox: ${sb.kind}`);'
      - run: pnpm typecheck
      - run: pnpm exec vitest run --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-report.json"
      # Ortam eksikse (bwrap, PostgreSQL, IaC ikilileri) güvenlik testleri ATLANIR; CI'da atlanan test
      # doğrulanmamış bir "Enforced" iddiası demektir → iş başarısız olur.
      - name: Atlanan test yok
        run: node .github/scripts/assert-no-skipped-tests.mjs "$RUNNER_TEMP/vitest-report.json"

  # Gerçek Kubernetes kümesi (kind): k8s adapter'ının sahte API'nin göremediği davranışları — gerçek RBAC
  # (SelfSubjectRulesReview), server-side apply alan sahipliği, resourceVersion/uid ön koşulları, json-patch `test`,
  # Pod Security admission, Table biçimi, olay/log uçları — `packages/**/test/*.kind.test.ts` sınar. Ürün kimliği
  # ServiceAccount token'lı kubeconfig'ten `ops profile add k8s` ile izole OPS_HOME'a alınır; yönetici kubeconfig'i
  # yalnız test kurulumu içindir. Küme yoksa testler atlanır → aşağıdaki kapı işi düşürür.
  kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # kind ikilisi sürüm + sha256 pinli (yayıncının kind-linux-amd64.sha256sum dosyasıyla eşleştirildi; imza doğrulaması yok).
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
      # Düğüm imajı özetle pinli (kind v0.33.0 sürüm notlarındaki varsayılan imaj; Docker Hub etiket özetiyle aynı).
      KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: kind (sürüm + sha256 pinli)
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/kind-bin"; mkdir -p "$T"
          curl -fsSL -o "$T/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  $T/kind" | sha256sum -c -
          chmod +x "$T/kind"
          echo "$T" >> "$GITHUB_PATH"
      - name: Küme oluştur
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/kind-admin.kubeconfig"
          kind create cluster --name ops-it --image "$KIND_NODE_IMAGE" --wait 180s --kubeconfig "$KC"
          chmod 600 "$KC"
          kind version
          echo "OPS_TEST_KUBECONFIG=$KC" >> "$GITHUB_ENV"
      - run: pnpm exec vitest run --config vitest.kind.config.ts --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-kind-report.json"
      # Küme kurulamazsa veya OPS_TEST_KUBECONFIG kaybolursa testler atlanır: gerçek küme iddiası doğrulanmamış olur → iş düşer.
      - name: Atlanan test yok
        run: node .github/scripts/assert-no-skipped-tests.mjs "$RUNNER_TEMP/vitest-kind-report.json"
      - name: Küme tanılama (yalnız hata durumunda)
        if: failure()
        run: |
          kubectl --kubeconfig "$OPS_TEST_KUBECONFIG" get nodes,namespaces -o wide || true
          kubectl --kubeconfig "$OPS_TEST_KUBECONFIG" get events -A --sort-by=.metadata.creationTimestamp | tail -n 100 || true
          kubectl --kubeconfig "$OPS_TEST_KUBECONFIG" get deploy,rs,pods -A -o wide | grep -v kube-system || true

  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Bilinen zafiyetli bağımlılık (yüksek ve üstü) birleştirmeyi durdurur.
      - run: pnpm audit --audit-level high

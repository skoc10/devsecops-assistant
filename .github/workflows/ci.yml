name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Not: eylemler etiketle sabitlendi; sürüm sabitleme (SHA) için docs/design/13 "doğrulanacak" listesine bakın.
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Bağımlılık yaşam-döngüsü scriptleri kapalı (pnpm-workspace.yaml: onlyBuiltDependencies: [])
      - run: pnpm install --frozen-lockfile
      # Gerçek OS sandbox testleri (S-15) için bubblewrap. Ubuntu 24.04 runner'larında AppArmor
      # kullanıcı ad alanlarını kısıtlar; kısıt kapatılamazsa sandbox testleri otomatik ATLANIR
      # (detectSandbox yoklaması başarısız olur) — atlandığı test çıktısında uyarı olarak görünür.
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Gerçek PostgreSQL testleri (S-02/S-03/S-14 DB ayağı, I-02): testkit geçici bir küme başlatır
      # (TLS + scram; ayrı süreç, yalnız loopback). Sunucu kurulu değilse bu testler uyarıyla ATLANIR.
      - run: sudo apt-get install -y postgresql postgresql-client
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: pnpm typecheck
      - run: pnpm test
